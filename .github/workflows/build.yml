name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project ZIP
        run: |
          mkdir unpacked
          unzip GPS-Tajhizat-Manager.zip -d unpacked
          test -f unpacked/GPS-Tajhizat-Manager/settings.gradle.kts
      - name: Build APK
        working-directory: unpacked/GPS-Tajhizat-Manager
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Tajhizat-Manager-debug
          path: unpacked/GPS-Tajhizat-Manager/app/build/outputs/apk/debug/app-debug.apk
